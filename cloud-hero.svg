<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Mohammed Asif — AI Engineer and Full Stack Developer</title>
  <desc id="desc">A midnight blue sky with slowly drifting sky-blue clouds behind the developer name.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02060D"/><stop offset="52%" stop-color="#071827"/><stop offset="100%" stop-color="#082F49"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity=".82"/><stop offset="55%" stop-color="#7DD3FC" stop-opacity=".46"/><stop offset="100%" stop-color="#38BDF8" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/><stop offset="50%" stop-color="#38BDF8" stop-opacity=".95"/><stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <g id="cloudShape" fill="url(#cloud)">
      <ellipse cx="0" cy="18" rx="96" ry="24"/><ellipse cx="-43" cy="4" rx="42" ry="29"/><ellipse cx="0" cy="-13" rx="51" ry="44"/><ellipse cx="44" cy="0" rx="40" ry="30"/><ellipse cx="72" cy="15" rx="35" ry="20"/>
    </g>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#sky)"/>
  <circle cx="960" cy="40" r="180" fill="#0EA5E9" opacity=".17" filter="url(#blur)"/>
  <circle cx="170" cy="310" r="190" fill="#38BDF8" opacity=".12" filter="url(#blur)"/>
  <g opacity=".10" stroke="#7DD3FC" stroke-width="1"><path d="M0 90H1200M0 180H1200M0 270H1200"/><path d="M150 0V360M450 0V360M750 0V360M1050 0V360"/></g>
  <g>
    <g opacity=".72"><use href="#cloudShape" x="180" y="82"/><animateTransform attributeName="transform" type="translate" values="-180 0; 130 0; -180 0" dur="54s" repeatCount="indefinite"/></g>
    <g opacity=".64"><use href="#cloudShape" x="850" y="112"/><animateTransform attributeName="transform" type="translate" values="140 0; -170 0; 140 0" dur="68s" repeatCount="indefinite"/></g>
    <g opacity=".32"><use href="#cloudShape" x="520" y="290"/><animateTransform attributeName="transform" type="translate" values="-70 0; 70 0; -70 0" dur="61s" repeatCount="indefinite"/></g>
  </g>
  <rect width="1200" height="360" rx="18" fill="#02060D" opacity=".24"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="145" fill="#7DD3FC" font-size="13" letter-spacing="4">AI ENGINEERING  /  PRODUCT DEVELOPMENT</text>
    <text x="600" y="208" fill="#F0F9FF" font-size="58" font-weight="650" letter-spacing="-1.6">Mohammed Asif</text>
    <rect x="500" y="232" width="200" height="2" rx="1" fill="url(#accent)"/>
    <text x="600" y="267" fill="#BAE6FD" font-size="17" letter-spacing="1.8">AI ENGINEER  ·  FULL STACK DEVELOPER</text>
    <text x="600" y="315" fill="#9CCFE8" font-size="11" letter-spacing="3">RAG  /  AGENTS  /  MCP  /  FULL STACK</text>
  </g>
  <path d="M34 338H1166" stroke="#38BDF8" stroke-opacity=".4"/>
</svg>