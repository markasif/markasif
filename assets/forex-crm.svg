<svg xmlns="http://www.w3.org/2000/svg" width="440" height="205" viewBox="0 0 440 205">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#111827"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<radialGradient id="glow" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#34D399" stop-opacity="0.28"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><rect x="1" y="1" width="438" height="203" rx="18"/></clipPath>
</defs>
<style>
.card{opacity:0;animation:in .8s ease 0.4s forwards}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.dot{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.border{stroke-dasharray:90 1290;animation:run 5s linear infinite}
@keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-1380}}
.shine{animation:shine 6s ease-in-out infinite}
@keyframes shine{0%,100%{opacity:.5}50%{opacity:1}}
</style>
<g class="card">
<rect x="1" y="1" width="438" height="203" rx="18" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5"/>
<g clip-path="url(#clip)"><rect class="shine" x="0" y="0" width="440" height="205" fill="url(#glow)"/></g>
<rect class="border" x="1" y="1" width="438" height="203" rx="18" fill="none" stroke="url(#ac)" stroke-width="2.2" stroke-linecap="round"/>
