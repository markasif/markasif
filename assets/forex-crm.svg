<text x="387" y="39" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="9.8" font-weight="700" fill="#E2E8F0" letter-spacing="0.8">LIVE</text>
<text x="24" y="92" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.8" fill="#94A3B8">Real-time B2B trading system with dashboards and</text><text x="24" y="111" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.8" fill="#94A3B8">role-based workflows.</text>
