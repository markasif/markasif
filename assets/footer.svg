<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#14123A"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="w1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0.55"/></linearGradient>
<linearGradient id="w2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.35"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0.35"/></linearGradient>
<clipPath id="c"><rect width="1000" height="260"/></clipPath>
</defs>
<style>
.a{animation:w1 9s linear infinite} .b{animation:w1 14s linear infinite reverse} .c{animation:w1 20s linear infinite}
@keyframes w1{from{transform:translateX(0)}to{transform:translateX(-1000px)}}
.rise{opacity:0;animation:ri 1s cubic-bezier(.2,.8,.2,1) .2s forwards}
@keyframes ri{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.dot{animation:pl 1.8s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}
.st{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:.9}}
</style>
<g clip-path="url(#c)">
<rect width="1000" height="260" fill="url(#bg)"/>
<circle class="st" cx="120" cy="40" r="1.4" fill="#fff"/><circle class="st" cx="300" cy="80" r="1.1" fill="#22D3EE" style="animation-delay:1s"/><circle class="st" cx="620" cy="34" r="1.5" fill="#fff" style="animation-delay:2s"/><circle class="st" cx="860" cy="70" r="1.2" fill="#A78BFA" style="animation-delay:.6s"/><circle class="st" cx="470" cy="56" r="1" fill="#fff" style="animation-delay:1.6s"/>
<path class="c" d="M0 150 Q125 110 250 150 T500 150 T750 150 T1000 150 T1250 150 T1500 150 T1750 150 T2000 150 V260 H0Z" fill="url(#w2)"/>
<path class="b" d="M0 170 Q125 135 250 170 T500 170 T750 170 T1000 170 T1250 170 T1500 170 T1750 170 T2000 170 V260 H0Z" fill="url(#w1)" fill-opacity="0.8"/>
<path class="a" d="M0 195 Q125 165 250 195 T500 195 T750 195 T1000 195 T1250 195 T1500 195 T1750 195 T2000 195 V260 H0Z" fill="#0B1020" fill-opacity="0.92"/>
</g>
<g class="rise">
<text x="500" y="72" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#F8FAFC">Let's build something <tspan fill="url(#ac)">intelligent</tspan> together</text>
<circle class="dot" cx="324" cy="102" r="4" fill="#34D399"/>
<text x="336" y="106" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12" fill="#A7F3D0" letter-spacing="1.5" textLength="348" lengthAdjust="spacing">OPEN TO COLLABORATIONS AND OPPORTUNITIES</text>
</g>
<text x="500" y="232" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace" font-size="11.5" fill="#64748B" letter-spacing="1.6">© 2026 MOHAMMED ASIF  ·  AI ENGINEER  ·  FULL STACK DEVELOPER</text>
</svg>