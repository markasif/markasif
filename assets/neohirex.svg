<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#111827"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
<radialGradient id="glow" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#A78BFA" stop-opacity="0.28"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><rect x="1" y="1" width="898" height="188" rx="18"/></clipPath>
</defs>
<style>
.card{opacity:0;animation:in .8s ease 0.0s forwards}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.dot{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.border{stroke-dasharray:90 2180;animation:run 5s linear infinite}
@keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-2270}}
.shine{animation:shine 6s ease-in-out infinite}
@keyframes shine{0%,100%{opacity:.5}50%{opacity:1}}
</style>
<g class="card">
<rect x="1" y="1" width="898" height="188" rx="18" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5"/>
<g clip-path="url(#clip)"><rect class="shine" x="0" y="0" width="900" height="190" fill="url(#glow)"/></g>
<rect class="border" x="1" y="1" width="898" height="188" rx="18" fill="none" stroke="url(#ac)" stroke-width="2.2" stroke-linecap="round"/>
<rect x="24" y="22" width="40" height="40" rx="12" fill="url(#ac)" fill-opacity="0.18" stroke="#A78BFA" stroke-opacity="0.5"/>
<text x="44" y="49" text-anchor="middle" font-size="20" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">🧑‍💼</text>
<text x="76" y="39" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#F8FAFC">NeoHireX</text>
<text x="76" y="57" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10.5" fill="#A78BFA" letter-spacing="1.2">NEOINTELLI · COMPANY PRODUCT</text>
<rect x="760" y="24" width="120" height="22" rx="11" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.45"/>
<circle class="dot" cx="774" cy="35" r="3.4" fill="#A78BFA"/>
<text x="783" y="39" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="9.8" font-weight="700" fill="#E2E8F0" letter-spacing="0.8">IN DEVELOPMENT</text>
<text x="24" y="92" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.8" fill="#94A3B8">End-to-end AI recruitment platform that handles a company&#x27;s</text><text x="24" y="111" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.8" fill="#94A3B8">full hiring workflow, from sourcing and screening to hiring.</text>
<rect x="24" y="128" width="38" height="22" rx="11" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.45"/><text x="43" y="143" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10.5" fill="#E2E8F0">RAG</text><rect x="69.8" y="128" width="77" height="22" rx="11" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.45"/><text x="108" y="143" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10.5" fill="#E2E8F0">AI Agents</text><rect x="155.2" y="128" width="38" height="22" rx="11" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.45"/><text x="174" y="143" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10.5" fill="#E2E8F0">MCP</text><rect x="201.0" y="128" width="84" height="22" rx="11" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.45"/><text x="243" y="143" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10.5" fill="#E2E8F0">Full Stack</text>
<line x1="24" y1="162" x2="876" y2="162" stroke="#1E293B"/>
<text x="24" y="180" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="url(#ac)"><tspan fill="#A78BFA">&#9656; </tspan><tspan fill="#CBD5E1">Built at Neointelli, Bengaluru</tspan></text>
</g>
</svg>