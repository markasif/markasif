<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Mohammed Asif — AI Engineer and Full Stack Developer</title>
  <desc id="desc">A minimal midnight sky with slowly drifting sky-blue clouds behind the developer name.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="58%" stop-color="#0A1728"/>
      <stop offset="100%" stop-color="#102D45"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity=".72"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity=".13"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
    <g id="cloudShape" fill="url(#cloud)">
      <ellipse cx="0" cy="18" rx="90" ry="23"/>
      <ellipse cx="-42" cy="4" rx="39" ry="28"/>
      <ellipse cx="0" cy="-12" rx="48" ry="43"/>
      <ellipse cx="42" cy="1" rx="38" ry="29"/>
      <ellipse cx="68" cy="15" rx="35" ry="19"/>
    </g>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#sky)"/>
  <circle cx="940" cy="40" r="150" fill="#0284C7" opacity=".13" filter="url(#blur)"/>
  <circle cx="180" cy="300" r="180" fill="#0EA5E9" opacity=".10" filter="url(#blur)"/>
  <g opacity=".12" stroke="#7DD3FC" stroke-width="1">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200"/>
    <path d="M100 0V360M300 0V360M500 0V360M700 0V360M900 0V360M1100 0V360"/>
  </g>
  <g opacity=".68">
    <g>
      <use href="#cloudShape" x="180" y="72" transform="translate(180 72) scale(.72) translate(-180 -72)"/>
      <animateTransform attributeName="transform" type="translate" values="-140 0; 130 0; -140 0" dur="48s" repeatCount="indefinite"/>
    </g>
    <g opacity=".65">
      <use href="#cloudShape" x="820" y="105" transform="translate(820 105) scale(1.02) translate(-820 -105)"/>
      <animateTransform attributeName="transform" type="translate" values="120 0; -150 0; 120 0" dur="62s" repeatCount="indefinite"/>
    </g>
    <g opacity=".45">
      <use href="#cloudShape" x="510" y="290" transform="translate(510 290) scale(1.18) translate(-510 -290)"/>
      <animateTransform attributeName="transform" type="translate" values="-80 0; 80 0; -80 0" dur="55s" repeatCount="indefinite"/>
    </g>
  </g>
  <rect x="0" y="0" width="1200" height="360" fill="#050B14" opacity=".27"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="145" fill="#7DD3FC" font-size="13" letter-spacing="5">DEVELOPER ID  /  IN-01</text>
    <text x="600" y="207" fill="#F0F9FF" font-size="56" font-weight="650" letter-spacing="-1.5">Mohammed Asif</text>
    <rect x="510" y="231" width="180" height="2" rx="1" fill="url(#glow)"/>
    <text x="600" y="264" fill="#BAE6FD" font-size="17" letter-spacing="2">AI ENGINEER  ·  FULL STACK DEVELOPER</text>
    <text x="600" y="314" fill="#7C9BB5" font-size="11" letter-spacing="3">RAG  /  AGENTS  /  MCP  /  PRODUCT ENGINEERING</text>
  </g>
  <path d="M36 336H1164" stroke="#38BDF8" stroke-opacity=".35"/>
</svg>
