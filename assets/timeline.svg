.dot{animation:pl 2s ease-in-out infinite}@keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}
.ring{transform-box:fill-box;transform-origin:center;animation:rg 2.4s ease-out infinite}
@keyframes rg{from{transform:scale(1);opacity:.9}to{transform:scale(3);opacity:0}}
.tl{stroke-dasharray:340;animation:tl 16s ease-in-out infinite}
@keyframes tl{0%{stroke-dashoffset:340}10%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
