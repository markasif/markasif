nimation-duration:118s;animation-delay:-96s" opacity="0.24"><g transform="translate(0 196)"><g transform="scale(1.3)" fill="#FFFFFF"><ellipse cx="0" cy="0" rx="96" ry="24"/><circle cx="-38" cy="-12" r="32"/><circle cx="6" cy="-26" r="44"/><circle cx="52" cy="-10" r="30"/><ellipse cx="-70" cy="4" rx="40" ry="16"/><ellipse cx="82" cy="6" rx="40" ry="15"/></g></g></g><g class="drift" style="animation-duration:92s;animation-delay:-66s" opacity="0.5"><g transform="translate(0 96)"><g transform="scale(2.1)" fill="#FFFFFF"><ellipse cx="0" cy="0" rx="96" ry="24"/><circle cx="-38" cy="-12" r="32"/><circle cx="6" cy="-26" r="44"/><circle cx="52" cy="-10" r="30"/><ellipse cx="-70" cy="4" rx="40" ry="16"/><ellipse cx="82" cy="6" rx="40" ry="15"/></g></g></g><g class="drift" style="animation-duration:130s;animation-delay:-20s" opacity="0.16"><g transform="translate(0 300)"><g transform="scale(2.2)" fill="#FFFFFF"><ellipse cx="0" cy="0" rx="96" ry="24"/><circle cx="-38" cy="-12" r="32"/><circle cx="6" cy="-26" r="44"/><circle cx="52" cy="-10" r="30"/><ellipse cx="-70" cy="4" rx="40" ry="16"/><ellipse cx="82" cy="6" rx="40" ry="15"/></g></g></g></g>
