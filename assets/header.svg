<style>
.st{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.o1{animation:f1 10s ease-in-out infinite} .o2{animation:f2 12s ease-in-out infinite} .o3{animation:f1 14s ease-in-out infinite reverse}
@keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,18px)}}
@keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,-14px)}}
.cloud{animation:cl 38s linear infinite} .cloud2{animation:cl 52s linear infinite;animation-delay:-20s}
@keyframes cl{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}
.spin{animation:sp 26s linear infinite} .spinr{animation:sp 38s linear infinite reverse} .orbit{animation:sp 22s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.self{transform-box:fill-box;transform-origin:center;animation:sp 22s linear infinite}
.rise{opacity:0;animation:ri 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ri{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.ul{stroke-dasharray:420;stroke-dashoffset:420;animation:dr 1.6s 1s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.dot{animation:pl 1.8s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}
.wave{transform-box:fill-box;transform-origin:70% 70%;animation:wv 2.4s ease-in-out infinite}
@keyframes wv{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.glint{animation:gl 6s ease-in-out infinite}
@keyframes gl{0%,50%{transform:translateX(-200px) skewX(-20deg)}100%{transform:translateX(1200px) skewX(-20deg)}}
</style>
