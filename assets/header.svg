<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="420" viewBox="0 0 1000 420">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="0.22" stop-color="#0284C7"/><stop offset="0.58" stop-color="#075985"/><stop offset="1" stop-color="#020617"/></linearGradient>
<linearGradient id="fadeb" x1="0" y1="0" x2="0" y2="1"><stop offset="0.55" stop-color="#020617" stop-opacity="0"/><stop offset="1" stop-color="#020617" stop-opacity="0.95"/></linearGradient>
<radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E0F2FE" stop-opacity="0.75"/><stop offset="1" stop-color="#E0F2FE" stop-opacity="0"/></radialGradient>
<linearGradient id="nm" gradientUnits="userSpaceOnUse" x1="180" y1="0" x2="820" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#BAE6FD"/></linearGradient>
<linearGradient id="uln" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="700" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3.2"/></filter>
<filter id="shadow" x="-10%" y="-30%" width="120%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#020617" flood-opacity="0.45"/></filter>
<clipPath id="rc"><rect width="1000" height="420"/></clipPath></defs>
<style>
.drift{animation-name:dr;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes dr{from{transform:translateX(-340px)}to{transform:translateX(1340px)}}
.float{animation:fl 7s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.rise{opacity:0;animation:ri 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ri{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.ul{stroke-dasharray:420;stroke-dashoffset:420;animation:ul 1.6s .9s ease forwards}
@keyframes ul{to{stroke-dashoffset:0}}
.dot{animation:pl 2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}
</style>
<rect width="1000" height="420" fill="url(#sky)"/>
